name: Dart tests

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/dart-tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/dart-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Run library tests
        run: flutter test test/library/cue_segment_path_test.dart test/library/track_override_test.dart test/library/virtual_track_index_test.dart test/library/audio_folder_cover_test.dart test/library/collection_cover_path_test.dart test/library/union_search_result_test.dart test/library/audio_folder_container_track_test.dart test/play_service/cue_segment_playback_test.dart test/play_service/sacd_playback_test.dart test/play_service/sacd_source_resolver_test.dart test/play_service/sacd_pcm_cache_probe_test.dart test/play_service/replay_gain_test.dart test/play_service/lyric_line_advance_test.dart test/core/playback_preference_codec_test.dart test/core/playback_output_preference_test.dart test/core/network_proxy_test.dart test/core/app_http_test.dart test/core/update_checker_test.dart test/core/update_download_route_test.dart test/core/update_installer_test.dart test/core/app_data_path_test.dart test/core/cache_paths_test.dart test/core/cover_disk_cache_test.dart test/core/atomic_text_write_test.dart test/core/equalizer_action_state_test.dart test/core/log/diagnostic_redaction_test.dart test/services/online_album_test.dart test/services/online_album_selection_test.dart test/services/cn_music_client_test.dart test/services/online_artist_image_service_test.dart test/services/online_lyric/lyric_candidate_test.dart test/services/online_lyric/lyric_candidate_cache_test.dart test/services/online_lyric/lyric_candidate_service_test.dart test/services/online_lyric/lyric_candidate_romanization_alignment_test.dart test/lyric/krc_roman_words_test.dart test/lyric/karaok_romanization_alignment_test.dart test/lyric/lyric_loader_test.dart test/lyric/lrc_tool_test.dart test/page/now_playing_page/component/lyric_source_selection_test.dart test/page/uni_detail_header_layout_test.dart test/native/bass/bass_error_text_test.dart test/component/dsd_badge_test.dart test/component/hi_res_badge_test.dart test/library/audio_bit_depth_test.dart
