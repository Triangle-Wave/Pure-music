name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（vX.Y.Z）；留空只构建'
        required: false
        type: string
      prerelease:
        description: '标记为预发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      # 仓库没有提交 desktop_lyric/，但 CMake 的 install 阶段会复制它。
      # 从官方最新 portable 包里恢复完整目录，保证桌面歌词可用。
      - name: Restore desktop_lyric from latest release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/qingyueyin/Pure-music/releases/latest" `
            -Headers @{ "User-Agent" = "github-actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*portable.zip" } | Select-Object -First 1
          if (-not $asset) { throw "portable.zip not found in latest release" }

          $zip = Join-Path $env:RUNNER_TEMP "portable.zip"
          $extract = Join-Path $env:RUNNER_TEMP "portable"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $src = Get-ChildItem $extract -Recurse -Directory -Filter "desktop_lyric" | Select-Object -First 1
          if (-not $src) { throw "desktop_lyric not found in release package" }

          New-Item -ItemType Directory -Force -Path "desktop_lyric" | Out-Null
          Copy-Item -Path (Join-Path $src.FullName "*") -Destination "desktop_lyric" -Recurse -Force

          if (-not (Test-Path "desktop_lyric\desktop_lyric.exe")) {
            throw "desktop_lyric.exe missing after restore"
          }
          Get-ChildItem "desktop_lyric" -Recurse | Select-Object FullName, Length

      - name: Pub get
        run: flutter pub get

      # 本地没有 Flutter/Rust 时无法生成绑定；构建前在 CI 生成，保证 Rust 结构体与 Dart 绑定一致。
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --locked
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate FRB bindings
        run: flutter_rust_bridge_codegen generate

      # codegen 2.12.0 不生成子模块的 export 行；这三个入口固定需要。
      - name: Restore FRB module exports
        shell: pwsh
        run: |
          $targets = @{
            'lib/native/rust/api/library_db.dart' = @(
              "export 'library_db/play_counts.dart';"
            )
            'lib/native/rust/api/tag_reader.dart' = @(
              "export 'tag_reader/extra_metadata.dart';",
              "export 'tag_reader/index_state.dart';"
            )
          }
          foreach ($target in $targets.GetEnumerator()) {
            $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $target.Key)
            $missing = @($target.Value | Where-Object { $lines -notcontains $_ })
            if ($missing.Count -eq 0) { continue }

            $lastImport = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^import ') { $lastImport = $i }
            }
            if ($lastImport -lt 0) {
              throw "no import block in $($target.Key)"
            }

            $insert = @('') + $missing
            $lines.InsertRange($lastImport + 1, [string[]]$insert)
            Set-Content -LiteralPath $target.Key -Value $lines -Encoding utf8NoBOM
          }

      # 只保留绑定产物；恢复 codegen 顺带改写的 lock、lint 与插件注册文件。
      - name: Restore unrelated generated files
        shell: pwsh
        run: |
          git checkout -- analysis_options.yaml pubspec.lock windows/flutter
          git status --short

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: frb-generated
          path: |
            lib/native/rust/
            rust/src/frb_generated.rs
          if-no-files-found: error

      # Cargokit 的 MSB8066 会吞掉 cargo 错误；先单独构建 cdylib 暴露真实原因。
      - name: Check Rust build
        run: cargo build --manifest-path rust/Cargo.toml --release

      - name: Build release
        run: flutter build windows --release

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "build/windows/x64/runner/Release"
          $required = @(
            "$out/pure_music.exe",
            "$out/flutter_windows.dll",
            "$out/dll/BASS/bass.dll",
            "$out/dll/BASS/basswasapi.dll",
            "$out/dll/BASS/bass_fx.dll",
            "$out/dll/BASS/bassmix.dll",
            "$out/desktop_lyric/desktop_lyric.exe"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "Missing build output: $($missing -join ', ')"
          }
          "Build output verified."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-music-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.tag || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pure-music-windows-x64
          path: build/windows/x64/runner/Release

      # 打包脚本从仓库根读取 desktop_lyric；CI 不提交该目录，用构建产物恢复。
      - name: Restore desktop_lyric for packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "build/windows/x64/runner/Release/desktop_lyric"
          if (-not (Test-Path -LiteralPath "$src/desktop_lyric.exe" -PathType Leaf)) {
            throw "desktop_lyric.exe missing from build artifact"
          }
          if (-not (Test-Path -LiteralPath "desktop_lyric")) {
            Copy-Item -LiteralPath $src -Destination "desktop_lyric" -Recurse
          }
          if (-not (Test-Path -LiteralPath "desktop_lyric/desktop_lyric.exe" -PathType Leaf)) {
            throw "desktop_lyric restore failed"
          }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )
          if (@($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }).Count -gt 0) {
            Write-Host "Inno Setup already installed."
            exit 0
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "choco install innosetup failed with exit code $LASTEXITCODE"
          }

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            $env:REF_NAME.Trim()
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must be vX.Y.Z, got '$tag'"
          }
          $version = $Matches[1]

          $pubspec = Get-Content -LiteralPath "pubspec.yaml" -Raw
          $match = [regex]::Match($pubspec, '(?m)^\s*version\s*:\s*([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw "version not found in pubspec.yaml" }
          $pubVersion = $match.Groups[1].Value
          if ($pubVersion -ne $version) {
            throw "Tag $tag does not match pubspec version $pubVersion; bump pubspec.yaml before tagging"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\build_windows.ps1 -Version "${{ steps.version.outputs.version }}" -Mode 4 -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw "Portable packaging failed with exit code $LASTEXITCODE"
          }

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\build_windows.ps1 -Version "${{ steps.version.outputs.version }}" -Mode 5 -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw "Installer packaging failed with exit code $LASTEXITCODE"
          }

      - name: Verify release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "output/pure_music_${env:VERSION}_release_installer.exe",
            "output/pure_music_${env:VERSION}_release_installer.exe.sha256",
            "output/pure_music_${env:VERSION}_release_portable.zip",
            "output/pure_music_${env:VERSION}_release_portable.zip.sha256"
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Missing release assets: $($missing -join ', ')"
          }
          foreach ($shaPath in @($expected | Where-Object { $_ -like "*.sha256" })) {
            $text = (Get-Content -LiteralPath $shaPath -Raw).Trim()
            if ($text -notmatch '^[0-9a-fA-F]{64}\s+\*?\S+$') {
              throw "Invalid checksum content in $shaPath"
            }
          }
          Get-ChildItem output -File | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            output/pure_music_${{ steps.version.outputs.version }}_release_installer.exe
            output/pure_music_${{ steps.version.outputs.version }}_release_installer.exe.sha256
            output/pure_music_${{ steps.version.outputs.version }}_release_portable.zip
            output/pure_music_${{ steps.version.outputs.version }}_release_portable.zip.sha256
